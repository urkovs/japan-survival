 .section-heading { margin-top:26px; }
 .settings-row { gap:14px; }

function rate(rating){
 const s=state.session;if(!s||s.done||!s.revealed||!['again','hint','easy'].includes(rating))return;
 const id=s.queue[0],old=store.progress[id],now=Date.now();
 state.lastRating={session:JSON.parse(JSON.stringify(s)),id,progress:old?{...old}:null,day:today(),dayValue:store.daily[today()]||0};
 const interval=nextInterval(id,rating);
 store.progress[id]={status:rating==='easy'?'confident':'practicing',due:now+interval*DAY,interval,successes:rating==='easy'?(old?.successes||0)+1:0,reviews:(old?.reviews||0)+1,last:now};
 store.daily[today()]=(store.daily[today()]||0)+1;
 s.queue.shift();s.reviews++;s.ratings[rating]++;s.revealed=false;
 if(rating==='again'&&!s.repeated.includes(id)){s.repeated.push(id);s.queue.splice(Math.min(2,s.queue.length),0,id);s.total++;}

 }catch(e){toast('Audio isn’t available here. The phrase and romaji are still available.');}
}
function savePhrase(id){if(!byId.has(id))return;const on=store.saved.includes(id);store.saved=on?store.saved.filter(x=>x!==id):[...store.saved,id];save();document.querySelectorAll('[data-action="save-phrase"]').forEach(b=>{if(b.dataset.id===id){b.setAttribute('aria-pressed',String(!on));b.setAttribute('aria-label',`${on?'Save':'Unsave'} phrase: ${byId.get(id).romaji}`);}});if(state.route==='phrasebook'&&state.savedOnly)updatePhraseResults();toast(on?'Removed from saved phrases.':'Saved to your pocket phrasebook.');}
async function copyPhrase(id){const p=byId.get(id);if(!p)return;const text=`${p.jp}\n${p.romaji}\n${p.meaning}`;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);toast('Phrase copied.');return;}}catch(e){}const area=document.createElement('textarea');area.value=text;area.setAttribute('aria-label','Phrase to copy');area.style.cssText='position:fixed;left:16px;right:16px;top:110px;z-index:80;width:calc(100% - 32px);height:140px;background:var(--panel);color:var(--text)';document.body.appendChild(area);area.focus();area.select();try{if(document.execCommand('copy')){area.remove();toast('Phrase copied.');return;}}catch(e){}toast('The text is selected. Use your device’s Copy command.');area.addEventListener('blur',()=>area.remove(),{once:true});}
function exportBackup(){try{const blob=new Blob([JSON.stringify({...store,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`japan-survival-progress-${today()}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Backup download requested. Keep the JSON file somewhere safe.');}catch(e){toast('Backup could not be exported in this viewer. Open the app in a full browser.');}}
document.getElementById('backup-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>1024*1024){toast('That file is too large to be a progress backup.');return;}try{state.pendingImport=validate(JSON.parse(await file.text()));state.confirmReset=false;if(state.route!=='settings')navigate('settings');else renderSettings();toast('Backup read. Confirm replacement in the progress section.');}catch(err){toast('That is not a valid Japan Survival v3 backup. Your progress was not changed.');}});
document.addEventListener('click',e=>{
 const returnLink=e.target.closest('a[data-return]');if(returnLink){state.detailReturn=returnLink.dataset.return;return;}
 const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;
 const action=b.dataset.action,id=b.dataset.id,value=b.dataset.value;
 switch(action){
  case'quick-study':if(state.session&&!state.session.done)navigate('learn');else{state.studyKind='all';state.studyCat='all';state.studyCount=5;startStudy();}break;
  case'study-kind':state.studyKind=value;renderLearn();break;
  case'start-study':startStudy();break;
  case'reveal':revealAnswer();break;
  case'rate':rate(value);break;
  case'undo-rating':undoRating();break;
  case'end-study':state.session=null;state.lastRating=null;renderLearn();window.scrollTo(0,0);break;
  case'another-study':state.session=null;state.lastRating=null;renderLearn();window.scrollTo(0,0);break;
  case'study-situation':state.studyCat=id;state.studyKind='all';state.studyCount=5;startStudy();break;
  case'study-one':startStudy([id]);break;
  case'quiz-kind':state.quizKind=value;renderQuiz();break;
  case'quiz-mode':state.quizMode=value;renderQuiz();break;
  case'start-quiz':startQuiz();break;
  case'answer-quiz':answerQuiz(id);break;
  case'next-question':nextQuestion();break;
  case'quiz-show-text':state.quizSession.showText=true;renderQuestion();break;
  case'end-quiz':state.quizSession=null;renderQuiz();window.scrollTo(0,0);break;
  case'another-quiz':state.quizSession=null;renderQuiz();window.scrollTo(0,0);break;
  case'review-missed':startStudy(state.quizSession.missed);break;
  case'speak':speakPhrase(id,b.dataset.slow==='true',b);break;
  case'refresh-voices':refreshVoices();toast(audioAvailable?'Japanese audio is available.':'No Japanese voice is available in this browser.');break;
  case'save-phrase':savePhrase(id);break;
  case'copy-phrase':copyPhrase(id);break;
  case'filter-kind':state.filterKind=value;renderPhrasebook();break;
  case'saved-filter':state.savedOnly=!state.savedOnly;renderPhrasebook();break;
  case'clear-search':state.search='';document.getElementById('phrase-search').value='';updatePhraseResults();document.getElementById('phrase-search').focus();break;
  case'reset-filters':Object.assign(state,{search:'',filterKind:'all',filterCat:'all',filterPriority:'all',filterStatus:'all',savedOnly:false,sort:'situation'});renderPhrasebook();break;
  case'expand-all':state.allExpanded=!state.allExpanded;document.querySelectorAll('.phrase-row').forEach(d=>d.open=state.allExpanded);b.textContent=state.allExpanded?'Collapse details':'Show all details';break;
  case'toggle-setting':if(['dim','large','romaji'].includes(b.dataset.key)){store.settings[b.dataset.key]=!store.settings[b.dataset.key];save();applySettings();b.setAttribute('aria-checked',String(store.settings[b.dataset.key]));}break;
  case'export':exportBackup();break;
  case'import':document.getElementById('backup-file').click();break;
  case'confirm-import':if(state.pendingImport){store=state.pendingImport;state.pendingImport=null;state.session=null;state.quizSession=null;state.lastRating=null;save();applySettings();renderSettings();toast('Backup restored.');}break;
  case'cancel-import':state.pendingImport=null;renderSettings();break;
  case'reset-progress':state.confirmReset=true;renderSettings();break;
  case'cancel-reset':state.confirmReset=false;renderSettings();break;
  case'confirm-reset':store.progress={};store.daily={};store.quiz={answered:0,correct:0};state.confirmReset=false;state.session=null;state.quizSession=null;state.lastRating=null;save();renderSettings();toast('Learning progress cleared. Display settings and saved phrases kept.');break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='phrase-search'){state.search=e.target.value;updatePhraseResults();}});
document.addEventListener('change',e=>{const t=e.target;switch(t.id){
 case'study-cat':state.studyCat=t.value;renderLearn();break;
 case'study-count':state.studyCount=Number(t.value);renderLearn();break;
 case'quiz-cat':state.quizCat=t.value;renderQuiz();break;
 case'filter-cat':state.filterCat=t.value;updatePhraseResults();break;
 case'filter-priority':state.filterPriority=t.value;updatePhraseResults();break;
 case'filter-status':state.filterStatus=t.value;updatePhraseResults();break;
 case'filter-sort':state.sort=t.value;updatePhraseResults();break;
 case'audio-speed':store.settings.speed=Number(t.value);save();break;
 }});
document.addEventListener('toggle',e=>{if(e.target.classList?.contains('extra-filters'))state.moreOpen=e.target.open;},true);
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY','A'].includes(document.activeElement?.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(state.route==='learn'&&state.session&&!state.session.done){if(e.key===' '&&!state.session.revealed){e.preventDefault();revealAnswer();}else if(state.session.revealed&&['1','2','3'].includes(e.key)){rate(['again','hint','easy'][Number(e.key)-1]);}}});
function sizeNav(){const nav=document.querySelector('.bottom-nav');const height=getComputedStyle(nav).display==='none'?0:nav.getBoundingClientRect().height;document.documentElement.style.setProperty('--bottom-height',`${height}px`);}
if('ResizeObserver'in window)new ResizeObserver(sizeNav).observe(document.querySelector('.bottom-nav'));
window.addEventListener('resize',sizeNav);sizeNav();routeChanged();document.body.dataset.ready='true';
})();
</script>
</body>
</html>
