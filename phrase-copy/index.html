const all=groups.flatMap((g,gi)=>g[2].map((p,pi)=>({id:gi+"-"+pi,gi,en:p[0],ja:p[1],roman:p[2]})));

const $=id=>document.getElementById(id);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function render(){
 const cats=["All","★ Saved",...groups.map(g=>g[0])];
 $("chips").innerHTML=cats.map(c=>'<button class="chip" type="button" data-category="'+escapeHtml(c)+'" aria-pressed="'+(c===category)+'">'+escapeHtml(c)+'</button>').join("");
 const q=$("search").value.toLowerCase().trim();
 const filtered=all.filter(p=>(category==="All"||category==="★ Saved"&&saved.has(p.id)||groups[p.gi][0]===category)&&(!q||[p.en,p.ja,p.roman].join(" ").toLowerCase().includes(q)));
 let html="";
 groups.forEach((g,gi)=>{const entries=filtered.filter(p=>p.gi===gi);if(!entries.length)return;
 html+='<section><h2>'+escapeHtml(g[0])+'</h2><div class="cards">';
 entries.forEach(p=>{html+='<article class="card" data-card="'+p.id+'"><button type="button" class="maincopy" data-copy="'+p.id+'" aria-label="Copy Japanese phrase: '+escapeHtml(p.en)+'"><div class="copyrow"><span class="english">'+escapeHtml(p.en)+'</span><span class="copyicon">COPY</span></div><div class="japanese" lang="ja">'+escapeHtml(p.ja)+'</div>'+( $("romaji").checked?'<div class="roman">'+escapeHtml(p.roman)+'</div>':'')+'</button><div class="actions"><span class="hint">Tap above → copies Japanese</span><button type="button" data-fav="'+p.id+'" class="favorite" aria-label="'+(saved.has(p.id)?"Unsave":"Save")+' phrase">'+(saved.has(p.id)?"★":"☆")+'</button></div></article>';});
 html+='</div></section>';});
 $("results").innerHTML=html||'<p class="empty">No matching phrases.</p>';
}
async function copyPhrase(id){
 const phrase=all.find(p=>p.id===id);if(!phrase)return;
 const feedback=$("feedback"),card=document.querySelector('[data-card="'+id+'"]');let ok=false;
 // Legacy copy is synchronous and works in many iOS in-app browsers where Clipboard API fails.
 const area=$("fallbackarea");
 try{area.value=phrase.ja;area.focus({preventScroll:true});area.select();area.setSelectionRange(0,area.value.length);ok=document.execCommand("copy");}catch(e){}

 if(ok){feedback.textContent="✓ Copied Japanese to clipboard";feedback.classList.remove("error");if(card){card.classList.add("copied");card.querySelector(".copyicon").textContent="✓";setTimeout(()=>{card.classList.remove("copied");const i=card.querySelector(".copyicon");if(i)i.textContent="COPY"},1300);}} 
 else{feedback.textContent="Copy was blocked — long-press Japanese to select and copy";feedback.classList.add("error");}
}
$("results").addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(b){copyPhrase(b.dataset.copy);return}const fav=e.target.closest("[data-fav]");if(fav){saved.has(fav.dataset.fav)?saved.delete(fav.dataset.fav):saved.add(fav.dataset.fav);try{localStorage.setItem("jpcopyfavorites",JSON.stringify([...saved]))}catch(e){}render()}});
